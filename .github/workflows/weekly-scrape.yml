name: Weekly scrape

on:
  schedule:
    - cron: "0 22 * * 0"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/weekly-scrape.yml"

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Scrape all branches and update the database
        run: python fitnessfactory_scraper.py

      - name: Commit the updated database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gym_schedule.db
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: weekly data $(date -u +%Y%m%d)"
            git push
          fi